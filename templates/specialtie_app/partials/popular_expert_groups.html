 <div class="block block--highlighted block-categories block-categories--layout--compact container">
    <style>
        /* ==========================================================
           دسته‌های محبوب - کارت‌های 3D گرادیانی
           هماهنگ با تم رنگی navbar (آبی-بنفش صنعت پویا)
        ========================================================== */
        .block-categories--layout--compact {
            padding: 50px 0;
            margin: 40px 0;
        }
        .block-categories--layout--compact > .container {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 45px 35px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 
                0 12px 50px rgba(30, 58, 138, 0.08),
                0 0 0 1px rgba(255,255,255,0.8) inset;
        }
        .block-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .block-header__title {
            font-size: 28px;
            font-weight: 800;
            color: #1e3a8a;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        .block-header__divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
            border-radius: 2px;
            margin: 0 auto;
        }

        /* لیست کارت‌ها - 3 ستونه با عرض محدود */
        .block-categories__list {
            display: grid;
            grid-template-columns: repeat(3, minmax(280px, 360px));
            gap: 28px;
            padding: 10px;
            perspective: 1200px;
            justify-content: center; /* مرکز کردن grid در صفحه‌های بزرگ */
        }

        /* در دسکتاپ فقط 7 کارت اول نمایش داده شود */
        @media (min-width: 769px) {
            .category-card--layout--compact:nth-child(n+8) {
                display: none !important;
            }
        }

        /* کارت اصلی */
        .category-card--layout--compact {
            position: relative;
            border-radius: 24px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
            width: 100%;
        }
        .category-card--layout--compact::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 26px;
            background: linear-gradient(135deg, rgba(59,130,246,0.5), rgba(139,92,246,0.5), rgba(236,72,153,0.5));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
            filter: blur(10px);
        }
        .category-card--layout--compact:hover::before {
            opacity: 1;
        }
        .category-card--layout--compact:hover {
            transform: translateY(-15px) rotateX(8deg) rotateY(-4deg) scale(1.05);
            z-index: 10;
        }

        /* بدنه کارت */
        .category-card__body {
            position: relative;
            border-radius: 24px;
            padding: 50px 24px 30px;
            text-align: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 
                0 8px 32px rgba(30, 58, 138, 0.08),
                0 0 0 1px rgba(255,255,255,0.7) inset,
                inset 0 1px 0 rgba(255,255,255,0.5);
            transition: box-shadow 0.4s ease;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .category-card--layout--compact:hover .category-card__body {
            box-shadow: 
                0 25px 60px rgba(59, 130, 246, 0.18),
                0 0 0 1px rgba(255,255,255,0.9) inset,
                inset 0 1px 0 rgba(255,255,255,0.6);
        }

        /* گرادیان‌های هماهنگ با تم navbar */
        .category-card--layout--compact:nth-child(7n+1) .category-card__body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
        }
        .category-card--layout--compact:nth-child(7n+2) .category-card__body {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        }
        .category-card--layout--compact:nth-child(7n+3) .category-card__body {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
        }
        .category-card--layout--compact:nth-child(7n+4) .category-card__body {
            background: linear-gradient(135deg, #0ea5e9 0%, #6366f1 100%);
        }
        .category-card--layout--compact:nth-child(7n+5) .category-card__body {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }
        .category-card--layout--compact:nth-child(7n+6) .category-card__body {
            background: linear-gradient(135deg, #14b8a6 0%, #3b82f6 100%);
        }
        .category-card--layout--compact:nth-child(7n+7) .category-card__body {
            background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 100%);
        }

        /* افکت درخشش */
        .category-card__body::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .category-card--layout--compact:hover .category-card__body::after {
            opacity: 1;
        }

        /* نشان تعداد - گوشه بالا-راست */
        .category-card__count {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 800;
            color: #1e3a8a;
            border: 2px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
            z-index: 5;
            transition: all 0.3s ease;
            direction: rtl;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .category-card__count .num {
            color: #1e3a8a;
            font-weight: 900;
            font-size: 14px;
        }
        .category-card__count .label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
        }
        .category-card--layout--compact:hover .category-card__count {
            transform: scale(1.1) translateZ(15px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        /* نام دسته - وسط کارت */
        .category-card__name {
            margin-top: 8px;
            z-index: 2;
            width: 100%;
            text-align: center;
        }
        .category-card__name a {
            color: #ffffff !important;
            font-size: 18px;
            font-weight: 800;
            text-decoration: none;
            display: inline-block;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            letter-spacing: 0.3px;
            line-height: 1.5;
            white-space: normal;
        }
        .category-card--layout--compact:hover .category-card__name a {
            transform: translateZ(25px);
            text-shadow: 0 4px 12px rgba(0,0,0,0.4);
        }

        /* انیمیشن شناور */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .category-card--layout--compact {
            animation: float 4s ease-in-out infinite;
        }
        .category-card--layout--compact:nth-child(2n) { animation-delay: 0.5s; }
        .category-card--layout--compact:nth-child(3n) { animation-delay: 1s; }
        .category-card--layout--compact:nth-child(4n) { animation-delay: 1.5s; }
        .category-card--layout--compact:nth-child(5n) { animation-delay: 2s; }
        .category-card--layout--compact:nth-child(6n) { animation-delay: 2.5s; }
        .category-card--layout--compact:nth-child(7n) { animation-delay: 0.3s; }

        .category-card--layout--compact:hover {
            animation-play-state: paused;
        }

        /* ریسپانسیو */
        @media (max-width: 1200px) {
            .block-categories__list {
                grid-template-columns: repeat(3, minmax(240px, 320px));
                gap: 22px;
            }
        }
        @media (max-width: 992px) {
            .block-categories__list {
                grid-template-columns: repeat(2, minmax(220px, 320px));
                gap: 20px;
            }
        }
        @media (max-width: 768px) {
            .block-categories__list {
                grid-template-columns: repeat(2, minmax(140px, 1fr));
                gap: 16px;
                padding: 5px;
            }
            .block-categories--layout--compact > .container {
                padding: 30px 18px;
            }
            .category-card__body {
                padding: 42px 16px 24px;
                min-height: 120px;
            }
            .category-card__name a {
                font-size: 15px;
            }
            .category-card__count {
                top: 10px;
                right: 10px;
                padding: 4px 10px;
                font-size: 11px;
            }
            .category-card__count .num {
                font-size: 12px;
            }
        }
        @media (max-width: 480px) {
            .block-categories__list {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
                gap: 12px;
            }
            .category-card__name a {
                font-size: 13px;
            }
            .category-card__body {
                padding: 38px 12px 20px;
                min-height: 100px;
            }
        }
    </style>

    <div class="container">
        <div class="block-header">
            <h3 class="block-header__title">افراد متخصص و متعهد</h3>
            <div class="block-header__divider"></div>
        </div>

        <div class="block-categories__list">
            {% for group in expert_groups %}
            <div class="block-categories__item category-card category-card--layout--compact">
                <div class="category-card__body">
                    <!-- تعداد متخصصین - گوشه بالا-راست -->
                    <div class="category-card__count" title="تعداد متخصصین">
                        <span class="num">{{ group.count }}</span>
                        <span class="label">نفر</span>
                    </div>

                    <!-- نام گروه در وسط کارت -->
                    <div class="category-card__name">
                        <a href="{% url "specialties:expert_of_group" slug=group.slug %}">{{ group.group_title }}</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
